name: testnet

# Manual testnet operations. Results go to the `testnet-results` branch.
#   accounts : create the main account via the faucet (public key only) and sub-accounts
#   deploy   : build and deploy the contract to app.<main>, then init
#   status   : print balances and contract state
# Signing uses the repo secret NEAR_PRIVATE_KEY (testnet only).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "accounts | deploy | status"
        required: true
        default: status
  push:
    branches: [main]
    paths: [".github/testnet-request"]

permissions:
  contents: write

env:
  MAIN: sealedcalls-towhid.testnet
  PUBKEY: ed25519:5pqFBSTaFibpsbjfVY1xP9FTSxRyCTBopo2eWxkKXpHr

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: which action
        id: act
        run: |
          A="${{ github.event.inputs.action }}"
          if [ -z "$A" ] && [ -f .github/testnet-request ]; then A=$(head -1 .github/testnet-request | tr -d '[:space:]'); fi
          echo "action=${A:-status}" >> "$GITHUB_OUTPUT"
      - name: install near-cli-rs
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
      - uses: dtolnay/rust-toolchain@stable
        if: steps.act.outputs.action == 'deploy'
        with: { targets: wasm32-unknown-unknown }
      - name: install cargo-near
        if: steps.act.outputs.action == 'deploy'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: run
        env:
          SK: ${{ secrets.NEAR_PRIVATE_KEY }}
          ACTION: ${{ steps.act.outputs.action }}
        run: |
          mkdir -p out; LOG=out/$ACTION.txt
          exec > >(tee -a "$LOG") 2>&1
          echo "action: $ACTION  commit: $GITHUB_SHA  time: $(date -u)"
          sign() { echo sign-with-plaintext-private-key --signer-public-key "$PUBKEY" --signer-private-key "$SK" send; }
          view() { near account view-account-summary "$1" network-config testnet now 2>&1 | grep -E "Native account balance|does not exist|Error" | head -2 || true; }
          case "$ACTION" in
            accounts)
              if near account view-account-summary "$MAIN" network-config testnet now >/dev/null 2>&1; then
                echo "$MAIN already exists"
              else
                near account create-account sponsor-by-faucet-service "$MAIN" use-manually-provided-public-key "$PUBKEY" network-config testnet create || echo "FAUCET FAILED"
              fi
              view "$MAIN"
              [ -n "$SK" ] || { echo "NEAR_PRIVATE_KEY secret not set: sub-accounts skipped"; exit 0; }
              for sub in app:3 caller:1 m1:0.5 m2:0.5; do
                name="${sub%%:*}.$MAIN"; amt="${sub##*:} NEAR"
                if near account view-account-summary "$name" network-config testnet now >/dev/null 2>&1; then echo "$name exists"; continue; fi
                near account create-account fund-myself "$name" "$amt" use-manually-provided-public-key "$PUBKEY" sign-as "$MAIN" network-config testnet $(sign) || echo "FAILED $name"
              done
              for a in "$MAIN" app.$MAIN caller.$MAIN m1.$MAIN m2.$MAIN; do echo "$a: $(view $a)"; done
              ;;
            deploy)
              [ -n "$SK" ] || { echo "NEAR_PRIVATE_KEY secret not set"; exit 1; }
              (cd contract && cargo near build non-reproducible-wasm) | tail -3
              WASM=contract/target/near/sealed_calls.wasm; sha256sum "$WASM"
              near contract deploy "app.$MAIN" use-file "$WASM" with-init-call new json-args '{}' prepaid-gas '100 Tgas' attached-deposit '0 NEAR' network-config testnet $(sign) \
                || near contract deploy "app.$MAIN" use-file "$WASM" without-init-call network-config testnet $(sign)
              near contract call-function as-read-only "app.$MAIN" get_club json-args '{"club":0}' network-config testnet now
              ;;
            status)
              for a in "$MAIN" app.$MAIN caller.$MAIN m1.$MAIN m2.$MAIN; do echo "$a: $(view $a)"; done
              near contract call-function as-read-only "app.$MAIN" get_club json-args '{"club":0}' network-config testnet now 2>&1 | tail -30 || true
              ;;
            *) echo "unknown action $ACTION"; exit 1;;
          esac
      - name: publish log
        if: always()
        run: |
          git config --global user.name "sealed-calls-ci"; git config --global user.email "ci@users.noreply.github.com"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf pub && git clone -q --depth 1 -b testnet-results "$REPO" pub 2>/dev/null || (mkdir -p pub && cd pub && git init -q -b testnet-results)
          cp out/*.txt pub/ 2>/dev/null || true
          cd pub && git add -A && git commit -q -m "testnet ${{ steps.act.outputs.action }} $(date -u +%FT%TZ)" && git push -q "$REPO" testnet-results
