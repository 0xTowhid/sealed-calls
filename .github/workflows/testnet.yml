name: testnet

# Testnet operations, run by pushing .github/testnet-request (space-separated actions, in order)
# or by hand from the Actions tab. Logs go to the `testnet-results` branch.
#   accounts | deploy | e2e | status      (see scripts/testnet.sh)
# Signing uses the repo secret NEAR_PRIVATE_KEY (testnet only).
on:
  workflow_dispatch:
    inputs:
      actions:
        description: "space-separated: accounts deploy e2e status"
        required: true
        default: status
  push:
    branches: [main]
    paths: [".github/testnet-request"]

permissions:
  contents: write

concurrency: { group: testnet, cancel-in-progress: false }

env:
  MAIN: sealedcalls-towhid.testnet
  PUBKEY: ed25519:5pqFBSTaFibpsbjfVY1xP9FTSxRyCTBopo2eWxkKXpHr

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: which actions
        id: act
        run: |
          A="${{ github.event.inputs.actions }}"
          [ -z "$A" ] && A=$(head -1 .github/testnet-request)
          echo "actions=$A" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: install near-cli-rs
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
      - uses: dtolnay/rust-toolchain@stable
        if: contains(steps.act.outputs.actions, 'deploy')
        with: { targets: wasm32-unknown-unknown }
      - name: install cargo-near
        if: contains(steps.act.outputs.actions, 'deploy')
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: scorer location (pinned to the current dist commit)
        run: |
          SHA=$(git ls-remote origin refs/heads/dist | cut -f1)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$SHA/scorer.wasm"
          echo "SCORER_URL=$URL" >> "$GITHUB_ENV"
          echo "SCORER_HASH=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: run
        env:
          SK: ${{ secrets.NEAR_PRIVATE_KEY }}
        run: |
          [ -n "$SK" ] || { echo "NEAR_PRIVATE_KEY secret is not set"; exit 1; }
          (cd scripts && npm install --silent)
          mkdir -p out; STAMP=$(date -u +%Y%m%d-%H%M%S)
          for a in ${{ steps.act.outputs.actions }}; do
            echo "=== $a  commit $GITHUB_SHA  $(date -u)" | tee -a "out/$STAMP-$a.txt"
            bash scripts/testnet.sh "$a" 2>&1 | tee -a "out/$STAMP-$a.txt"
          done
      - name: publish log
        if: always()
        run: |
          git config --global user.name "sealed-calls-ci"; git config --global user.email "ci@users.noreply.github.com"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf pub
          git clone -q --depth 1 -b testnet-results "$REPO" pub 2>/dev/null || (mkdir -p pub && cd pub && git init -q -b testnet-results)
          cp out/*.txt pub/ 2>/dev/null || true
          cd pub && git add -A && git commit -q -m "testnet: ${{ steps.act.outputs.actions }}" && git push -q "$REPO" testnet-results
