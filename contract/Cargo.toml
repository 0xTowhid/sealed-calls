[package]
name = "sealed-calls"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sealed memecoin calls with forced reveal, attested scoring and escrowed caller pay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
