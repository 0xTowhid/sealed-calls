[package]
name = "scorer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sealed Calls scoring job for OutLayer (wasm32-wasip2): indicative $500-trade returns for Solana memecoin calls"

[[bin]]
name = "scorer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
